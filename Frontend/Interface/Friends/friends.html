<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Friends - StudentHub</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link rel="stylesheet" href="/Interface/global.css" />
    <link rel="stylesheet" href="/Interface/Friends/friends.css" />
  </head>
  <body>
    <div class="sidebar">
      <div class="sidebar-principal">
        <img src="/Images/logo.png" id="logo" alt="StudentHub Logo" />
        <a href="/dashboard" class="nav-link"
          ><span class="material-symbols-rounded">space_dashboard</span
          ><span class="nav_label">Dashboard</span></a
        >
        <a href="/schedule" class="nav-link"
          ><span class="material-symbols-rounded">calendar_today</span
          ><span class="nav_label">Schedule</span></a
        >
        <a href="/tasks" class="nav-link"
          ><span class="material-symbols-rounded">task_alt</span
          ><span class="nav_label">Tasks</span></a
        >
        <a href="/friends" class="nav-link active-page"
          ><span class="material-symbols-rounded">group</span
          ><span class="nav_label">Friends</span></a
        >
        <a href="/messages" class="nav-link"
          ><span class="material-symbols-rounded">chat_bubble</span
          ><span class="nav_label">Messages</span></a
        >
        
      </div>
      <div id="sidebar-secundar">
        <a href="/settings" class="nav-link"
          ><span class="material-symbols-rounded">settings</span
          ><span class="nav_label">Settings</span></a
        >
        <a href="/login" class="nav-link"
          ><span class="material-symbols-rounded">logout</span
          ><span class="nav_label">Log out</span></a
        >
      </div>
    </div>

    <main class="main-container">
      <header class="friends-header">
        <div>
          <h1>My Connections</h1>
          <p class="header-subtitle">Manage your friends and requests.</p>
        </div>
        <button class="btn-find-friends" id="openFindModalBtn">
          <span class="material-symbols-rounded">person_add</span>
          Find Friends
        </button>
      </header>

      <section id="requests-section" style="display: none">
        <h2 class="section-title">
          Friend Requests <span id="requests-count" class="badge-count">0</span>
        </h2>
        <div class="friends-grid-container" id="requestsList"></div>
        <hr class="section-divider" />
      </section>

      <section id="friends-section">
        <h2 class="section-title">All Friends</h2>
        <div class="friends-grid-container" id="friendsList">
          <p style="color: var(--text-grey)">Loading friends...</p>
        </div>
      </section>
    </main>

    <div id="findFriendsModal" class="modal-overlay">
      <div
        class="modal-content"
        style="
          max-width: 600px;
          min-height: 400px;
          display: flex;
          flex-direction: column;
        "
      >
        <div class="modal-header">
          <h2>Find People</h2>
          <button id="closeFindModalBtn" class="btn-icon">
            <span class="material-symbols-rounded">close</span>
          </button>
        </div>

        <div class="search-bar-container">
          <span class="material-symbols-rounded search-icon">search</span>
          <input
            type="text"
            id="userSearchInput"
            placeholder="Search by username..."
            autocomplete="off"
          />
        </div>

        <div class="search-results-container" id="searchResultsList">
          <p class="search-placeholder">Type to search for people.</p>
        </div>
      </div>
    </div>

    <script src="/Interface/Friends/friends.js"></script>
  </body>
</html>

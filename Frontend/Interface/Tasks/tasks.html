<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tasks - StudentHub</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />

    <link rel="stylesheet" href="/Interface/global.css" />
    <link rel="stylesheet" href="/Interface/Tasks/style_tasks.css" />
  </head>
  <body>
    <div class="sidebar">
      <div class="sidebar-principal">
        <img src="/Images/logo.png" id="logo" alt="StudentHub Logo" />
        <a href="/dashboard" class="nav-link"
          ><span class="material-symbols-rounded">space_dashboard</span
          ><span class="nav_label">Dashboard</span></a
        >
        <a href="/schedule" class="nav-link"
          ><span class="material-symbols-rounded">calendar_today</span
          ><span class="nav_label">Schedule</span></a
        >
        <a href="/tasks" class="nav-link active-page"
          ><span class="material-symbols-rounded">task_alt</span
          ><span class="nav_label">Tasks</span></a
        >
        <a href="/friends" class="nav-link"
          ><span class="material-symbols-rounded">group</span
          ><span class="nav_label">Friends</span></a
        >
        <a href="/messages" class="nav-link"
          ><span class="material-symbols-rounded">chat_bubble</span
          ><span class="nav_label">Messages</span></a
        >
      
      </div>
      <div id="sidebar-secundar">
        <a href="/settings" class="nav-link"
          ><span class="material-symbols-rounded">settings</span
          ><span class="nav_label">Settings</span></a
        >
        <a href="/login" class="nav-link"
          ><span class="material-symbols-rounded">logout</span
          ><span class="nav_label">Log out</span></a
        >
      </div>
    </div>

    <main class="main-container">
      <header class="tasks-header">
        <div class="header-title">
          <h1>My Tasks</h1>
          <p class="header-subtitle">Manage your activities and projects.</p>
        </div>
        <div class="header-actions">
          <div class="search-bar">
            <span class="material-symbols-rounded">search</span>
            <input type="text" placeholder="Search tasks..." />
          </div>
          <button class="btn-add-task">
            <span class="material-symbols-rounded">add</span>
            Add Task
          </button>
        </div>
      </header>

      <div class="filters-container">
        <button class="filter-pill active" data-filter="all">All tasks</button>
        <button class="filter-pill" data-filter="todo">To do</button>
        <button class="filter-pill" data-filter="inprogress">
          In progress
        </button>
        <button class="filter-pill" data-filter="done">Done</button>
      </div>

      <div class="tasks-list-container" id="tasksList">
        <p style="color: var(--text-grey)">Loading tasks...</p>
      </div>
    </main>

    <div id="addTaskModal" class="modal-overlay">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Add New Task</h2>
          <button id="closeModalBtn" class="btn-icon">
            <span class="material-symbols-rounded">close</span>
          </button>
        </div>

        <form id="modalTaskForm">
          <div class="input-group">
            <label for="modalTaskName"
              >Task Name <span style="color: var(--danger-red)">*</span></label
            >
            <input
              type="text"
              id="modalTaskName"
              required
              placeholder="e.g., Finish Math Homework"
            />
          </div>
          <div class="input-group">
            <label for="modalTaskSubject">Subject</label>
            <input
              type="text"
              id="modalTaskSubject"
              placeholder="e.g., Math, Biology"
            />
          </div>
          <div class="input-group">
            <label for="modalTaskDate">Due Date</label>
            <input type="date" id="modalTaskDate" />
          </div>
          <div class="modal-actions">
            <button type="button" class="btn-cancel" id="cancelBtn">
              Cancel
            </button>
            <button type="submit" class="btn-submit">Save Task</button>
          </div>
        </form>
      </div>
    </div>

    <script src="/Interface/Tasks/tasks.js"></script>
  </body>
</html>

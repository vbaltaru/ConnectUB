<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Messages - StudentHub</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link rel="stylesheet" href="/Interface/global.css" />
    <link rel="stylesheet" href="/Interface/Messages/chat.css" />
    <script src="/socket.io/socket.io.js"></script>
    <style>
      /* Stiluri pentru Modalul de Creare Grup */
      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(4px);
        animation: fadeIn 0.2s ease-out;
      }

      .modal-content {
        background-color: #fff;
        margin: 10vh auto;
        padding: 0;
        border: none;
        width: 90%;
        max-width: 400px;
        border-radius: 16px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        overflow: hidden;
        animation: slideIn 0.3s ease-out;
      }

      .modal-header {
        padding: 20px 24px;
        border-bottom: 1px solid #f1f5f9;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background-color: #fff;
      }

      .modal-header h3 {
        margin: 0;
        font-size: 1.1rem;
        color: #0f172a;
        font-weight: 600;
      }

      .close-modal {
        color: #94a3b8;
        font-size: 28px;
        font-weight: 400;
        line-height: 1;
        transition: color 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        cursor: pointer;
      }

      .close-modal:hover {
        color: #ef4444;
        background-color: #fef2f2;
      }

      .modal-body {
        padding: 24px;
      }

      .group-input {
        width: 100%;
        padding: 12px 16px;
        margin-bottom: 20px;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        font-size: 14px;
        transition: all 0.2s;
        outline: none;
        box-sizing: border-box;
        background-color: #f8fafc;
        color: #334155;
      }

      .group-input:focus {
        border-color: #6366f1;
        background-color: #fff;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
      }

      .friends-selection-container {
        max-height: 240px;
        overflow-y: auto;
        border: 1px solid #e2e8f0;
        border-radius: 10px;
        margin-bottom: 24px;
      }

      .friend-select-item {
        display: flex;
        align-items: center;
        padding: 12px 16px;
        border-bottom: 1px solid #f1f5f9;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      .friend-select-item:last-child {
        border-bottom: none;
      }

      .friend-select-item:hover {
        background-color: #f8fafc;
      }

      .friend-select-item input[type="checkbox"] {
        margin-right: 16px;
        width: 18px;
        height: 18px;
        accent-color: #6366f1;
        cursor: pointer;
        border-radius: 4px;
      }

      .friend-select-item label {
        cursor: pointer;
        font-size: 14px;
        color: #334155;
        font-weight: 500;
        flex-grow: 1;
      }

      .btn-create {
        width: 100%;
        padding: 14px;
        background-color: #6366f1;
        color: white;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: 0 4px 6px -1px rgba(99, 102, 241, 0.2);
      }

      .btn-create:hover {
        background-color: #4f46e5;
        transform: translateY(-1px);
        box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.25);
      }

      .btn-create:active {
        transform: translateY(0);
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      @keyframes slideIn {
        from {
          transform: translateY(10px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      /* Stiluri pentru avatar grup în modal */
      .group-modal-header-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 15px;
      }
      .group-modal-avatar {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        object-fit: cover;
        background-color: #e2e8f0;
        margin-bottom: 10px;
        border: 2px solid #6366f1;
      }
      .group-avatar-upload-label {
        font-size: 12px;
        color: #6366f1;
        cursor: pointer;
        font-weight: 600;
      }
      .group-avatar-upload-label:hover {
        text-decoration: underline;
      }

      /* FIX: Stiluri pentru avatarul din header-ul chat-ului (cerc) */
      .avatar-circle {
        width: 40px;
        height: 40px;
        min-width: 40px; /* Previne micșorarea */
        border-radius: 50%;
        background-color: #6366f1;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 18px;
        margin-right: 16px;
        margin-left: 5px;
        margin-top: 5px;
        padding: 2px;
        overflow: hidden;
      }

      /* Stiluri pentru avatar mic (sidebar) */
      .avatar-circle-sm {
        width: 32px;
        height: 32px;
        min-width: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        font-size: 13px;
        margin-right: 12px;
        padding: 2px;
        background-color: #e2e8f0;
        color: #475569;
        object-fit: cover;
      }

      /* Stiluri pentru item-ul din lista de prieteni */
      .friend-chat-item {
        padding: 10px 12px;
        border-radius: 8px;
        display: flex;
        align-items: center;
      }

      /* Stil pentru badge-ul de mesaje necitite */
      .unread-badge {
        background-color: #ef4444;
        color: white;
        font-size: 11px;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 10px;
        margin-left: auto;
        min-width: 18px;
        text-align: center;
        box-shadow: 0 2px 4px rgba(239, 68, 68, 0.3);
      }

      /* Stil pentru butonul de Kick */
      .btn-kick {
        color: #94a3b8;
        cursor: pointer;
        transition: color 0.2s;
        margin-left: 10px;
      }
      .btn-kick:hover {
        color: #ef4444;
      }

      /* Stil pentru butonul de atașare fișiere */
      .attach-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 10px;
        color: #64748b;
        cursor: pointer;
        transition: color 0.2s;
      }
      .attach-btn:hover {
        color: #6366f1;
      }
    </style>
  </head>
  <body>
    <div class="sidebar">
      <div class="sidebar-principal">
        <img src="/Images/logo.png" id="logo" alt="StudentHub Logo" />
        <a href="/dashboard" class="nav-link"
          ><span class="material-symbols-rounded">space_dashboard</span
          ><span class="nav_label">Dashboard</span></a
        >
        <a href="/schedule" class="nav-link"
          ><span class="material-symbols-rounded">calendar_today</span
          ><span class="nav_label">Schedule</span></a
        >
        <a href="/tasks" class="nav-link"
          ><span class="material-symbols-rounded">task_alt</span
          ><span class="nav_label">Tasks</span></a
        >
        <a href="/friends" class="nav-link"
          ><span class="material-symbols-rounded">group</span
          ><span class="nav_label">Friends</span></a
        >
        <a href="/messages" class="nav-link active-page"
          ><span class="material-symbols-rounded">chat_bubble</span
          ><span class="nav_label">Messages</span></a
        >
        
      </div>
      <div id="sidebar-secundar">
        <a href="/settings" class="nav-link"
          ><span class="material-symbols-rounded">settings</span
          ><span class="nav_label">Settings</span></a
        >
        <a href="/login" class="nav-link"
          ><span class="material-symbols-rounded">logout</span
          ><span class="nav_label">Log out</span></a
        >
      </div>
    </div>

    <main class="chat-main-container">
      <aside class="chat-sidebar">
        <div class="chat-sidebar-header">
          <h2>Messages</h2>
          <button
            id="createGroupBtn"
            title="Create Group"
            style="
              background: none;
              border: none;
              cursor: pointer;
              color: inherit;
            "
          >
            <span class="material-symbols-rounded">group_add</span>
          </button>
        </div>
        <div id="friendsListChat" class="friends-list-scroll"></div>
      </aside>

      <section class="chat-window">
        <div id="noChatSelected" class="no-chat-placeholder">
          <span class="material-symbols-rounded">forum</span>
          <p>Select a friend to start a conversation</p>
        </div>

        <div id="activeChatContainer" style="display: none">
          <header class="chat-header">
            <div class="user-chat-info">
              <div id="currentChatAvatar" class="avatar-circle">?</div>
              <h3 id="currentChatName">Username</h3>
            </div>
            <div class="chat-actions">
              <button
                id="deleteGroupBtn"
                title="Delete Group"
                style="
                  display: none;
                  background: none;
                  border: none;
                  color: #ef4444;
                  cursor: pointer;
                "
              >
                <span class="material-symbols-rounded">delete</span>
              </button>
            </div>
          </header>

          <div id="chatMessagesArea" class="messages-display"></div>

          <div class="chat-input-container">
            <input type="hidden" id="currentConversationId" />
            <label for="fileInput" class="attach-btn" title="Attach file"><span class="material-symbols-rounded">attach_file</span></label>
            <input type="file" id="fileInput" style="display: none;">
            <input
              type="text"
              id="messageInput"
              placeholder="Write a message..."
              autocomplete="off"
            />
            <button id="sendBtn">
              <span class="material-symbols-rounded">send</span>
            </button>
          </div>
        </div>
      </section>
    </main>

    <!-- Modal Create Group -->
    <div id="createGroupModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Create New Group</h3>
          <span id="closeGroupModal" class="close-modal">&times;</span>
        </div>
        <div class="modal-body">
          <input
            type="text"
            id="groupNameInput"
            class="group-input"
            placeholder="Group Name"
            autocomplete="off"
          />
          <div
            class="friends-selection-label"
            style="
              margin-bottom: 8px;
              font-size: 12px;
              color: #64748b;
              font-weight: 600;
              text-transform: uppercase;
            "
          >
            Select Members
          </div>
          <div
            id="friendsSelectionList"
            class="friends-selection-container"
          ></div>
          <button id="submitCreateGroup" class="btn-create">
            Create Group
          </button>
        </div>
      </div>
    </div>

    <!-- Modal Group Members -->
    <div id="groupMembersModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Group Members</h3>
          <span id="closeMembersModal" class="close-modal">&times;</span>
        </div>
        <div class="modal-body">
          <div id="groupMembersList" class="friends-selection-container"></div>
        </div>
        <div
          id="groupMembersFooter"
          class="modal-footer"
          style="
            padding: 15px 24px;
            border-top: 1px solid #f1f5f9;
            display: none;
          "
        >
          <button
            id="leaveGroupBtnModal"
            style="
              width: 100%;
              padding: 10px;
              background-color: #ef4444;
              color: white;
              border: none;
              border-radius: 8px;
              cursor: pointer;
              font-weight: 600;
              transition: background 0.2s;
            "
            onmouseover="this.style.backgroundColor = '#dc2626'"
            onmouseout="this.style.backgroundColor = '#ef4444'"
          >
            Leave Group
          </button>
        </div>
      </div>
    </div>

    <script src="/Interface/Messages/chat.js"></script>
  </body>
</html>

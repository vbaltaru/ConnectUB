<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ConnectUB</title>
    <link rel="stylesheet" href="/Interface/style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link rel="stylesheet" href="/Interface/global.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="sidebar">
      <div class="sidebar-principal">
        <img src="/Images/logo.png" id="logo" alt="StudentHub Logo" />
        <a href="/dashboard" class="nav-link active-page"
          ><span class="material-symbols-rounded">space_dashboard</span
          ><span class="nav_label">Dashboard</span></a
        >
        <a href="/schedule" class="nav-link"
          ><span class="material-symbols-rounded">calendar_today</span
          ><span class="nav_label">Schedule</span></a
        >
        <a href="/tasks" class="nav-link"
          ><span class="material-symbols-rounded">task_alt</span
          ><span class="nav_label">Tasks</span></a
        >
        <a href="/friends" class="nav-link"
          ><span class="material-symbols-rounded">group</span
          ><span class="nav_label">Friends</span></a
        >
        <a href="/messages" class="nav-link"
          ><span class="material-symbols-rounded">chat_bubble</span
          ><span class="nav_label">Messages</span></a
        >
      </div>
      <div id="sidebar-secundar">
        <a href="/settings" class="nav-link"
          ><span class="material-symbols-rounded">settings</span
          ><span class="nav_label">Settings</span></a
        >
        <a href="/login" class="nav-link"
          ><span class="material-symbols-rounded">logout</span
          ><span class="nav_label">Log out</span></a
        >
      </div>
    </div>
    <div id="Profile-Card">
      <span class="material-symbols-rounded" id="notifications">
        notifications
      </span>
      <img src="" id="user-avatar" />
      <div>
        <div id="Personal-Info">
          <span id="user-full-name">Loading...</span>
        </div>
        <div id="School-info">
          <span id="user-specialization">Loading...</span>
        </div>
      </div>
    </div>
    <div id="Tasks">
      <h1>My Tasks</h1>
      <div id="Task-Select">
        <span id="All_Tasks">All tasks</span>
        <span id="In_Progress">In progress</span>
        <span id="To_do">To do</span>
        <span id="Done">Done</span>
      </div>
      <div id="dashboard-tasks-list"></div>
    </div>

    <!-- SCHEDULE CARD -->
    <div id="Schedule-Card">
      <div id="Schedule-Data">
        <h4>My Schedule</h4>
        <div class="date-selector">
          <span class="material-symbols-rounded">calendar_month</span>
          <span class="current-date">May 14, Mon</span>
          <span class="material-symbols-rounded">arrow_drop_down</span>
        </div>
        <div id="dashboard-schedule-list"></div>
      </div>
    </div>
    <!-- FRIENDS CARD -->
    <div id="Friends-Card">
      <div class="card-header">
        <h5>My Friends</h5>
      </div>
      <div id="dashboard-friends-list" class="friends-list"></div>
    </div>
    <!-- GROUPS CARD -->
    <div id="Groups-Card">
      <div class="card-header">
        <h5>My Groups</h5>
      </div>
      <div id="dashboard-groups-list" class="groups-list"></div>
    </div>
    <script src="/Interface/dashboard.js"></script>
  </body>
</html>

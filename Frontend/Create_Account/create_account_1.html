<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/Create_Account/style_create_account.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="split-container">
      <div class="left-side">
        <div id="logo-motto">
          <div id="logo">
            <img id="Logo" src="/Images/logo.png" alt="ConnectUB Logo" />
          </div>
          <div id="Motto">
            <h1>
              <h1>Join the Community.</h1>
              <h2>Start Connecting.</h2>
              <h3>Create digital space to collaborate,</h3>
              <h4>chat, and grow with your peers.</h4>
            </h1>
          </div>
        </div>
      </div>
      <div class="right-side">
        <div class="signup-container">
          <div class="welcome-section">
            <h1>Welcome!</h1>
            <p>Sign up to get started</p>
          </div>

          <form class="signup-form">
            <div class="name-fields">
              <div class="form-group">
                <input
                  type="text"
                  id="firstName"
                  placeholder="First Name"
                  required
                />
              </div>
              <div class="form-group">
                <input
                  type="text"
                  id="lastName"
                  placeholder="Last Name"
                  required
                />
              </div>
            </div>

            <div class="form-group">
              <input
                type="email"
                id="email"
                placeholder="Email address"
                required
              />
            </div>

            <div class="form-group">
              <input
                type="password"
                id="password"
                placeholder="Password"
                required
              />
            </div>

            <button type="submit" class="signup-btn">Sign Up</button>
          </form>
        </div>
      </div>
    </div>
    <script src="/Frontend/Create_Account/create_account_1.js"></script>
  </body>
</html>

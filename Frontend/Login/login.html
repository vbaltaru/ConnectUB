<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../Login/style_login.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="split-container">
      <div class="left-side">
        <div id="logo-motto">
          <div id="logo">
            <img
              id="Logo"
              src="/Images/logo.png"
              alt="ConnectUB Logo"
            />
          </div>
          <div id="Motto">
            <h1>
              <h1>Stay Connected.</h1>
              <h2>Stay Informed.</h2>
              <h3>Your digital space to collaborate,</h3>
              <h4>chat, and grow with your peers.</h4>
            </h1>
          </div>
        </div>
      </div>
      <div class="right-side">
        <div class="login-container">
          <div id="Welcome-text">
            <h5>Welcome Back 👋</h5>
            <h6>Sign in to continue to ConnectUB</h6>
          </div>
          <form class="login-form">
            <div class="login-group">
              <input type="email" id="email" placeholder="Email address" />
              <input type="password" id="password" placeholder="Password" />
            </div>
            <button type="submit" id="Login">Login</button>
            <div class="form-links">
        
              <a href="../Create_Account/create_account_1.html" id="link-create">Don't have an account? <span id="Sign_up">Sign UP</span></a>
            </div>
          </form>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>

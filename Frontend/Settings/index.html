<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Setări Profil - StudentHub</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
    />
    <link rel="stylesheet" href="/Interface/global.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="sidebar">
      <div class="sidebar-principal">
        <img src="/Images/logo.png" id="logo" alt="StudentHub Logo" />
        <a href="/dashboard" class="nav-link"
          ><span class="material-symbols-rounded">space_dashboard</span
          ><span class="nav_label">Dashboard</span></a
        >
        <a href="/schedule" class="nav-link"
          ><span class="material-symbols-rounded">calendar_today</span
          ><span class="nav_label">Schedule</span></a
        >
        <a href="/tasks" class="nav-link"
          ><span class="material-symbols-rounded">task_alt</span
          ><span class="nav_label">Tasks</span></a
        >
        <a href="/friends" class="nav-link"
          ><span class="material-symbols-rounded">group</span
          ><span class="nav_label">Friends</span></a
        >
        <a href="/messages" class="nav-link"
          ><span class="material-symbols-rounded">chat_bubble</span
          ><span class="nav_label">Messages</span></a
        >
       
      </div>
      <div id="sidebar-secundar">
        <a href="/settings" class="nav-link active-page"
          ><span class="material-symbols-rounded">settings</span
          ><span class="nav_label">Settings</span></a
        >
        <a href="/login" class="nav-link"
          ><span class="material-symbols-rounded">logout</span
          ><span class="nav_label">Log out</span></a
        >
      </div>
    </div>

    <main class="main-container">
      <div class="settings-container">
        <h2>Profile Settings</h2>

        <form id="settingsForm">
          <div class="profile-section">
            <div class="avatar-container">
              <img
                id="avatarPreview"
                src="/uploads/default.png"
                alt="Profile Preview"
                class="avatar-img"
              />
            </div>
            <div class="profile-info-actions">
              <h3 id="username_label">Username</h3>
              <div class="action-buttons">
                <input
                  type="file"
                  id="profile_picture"
                  name="profile_picture"
                  accept="image/png, image/jpeg, image/jpg"
                />
                
               
              </div>
            </div>
          </div>

          <div class="form-grid">
            <div class="input-group">
              <label for="first_name">First Name</label>
              <input
                type="text"
                id="first_name"
                name="first_name"
                placeholder="e.g. John"
              />
            </div>

            <div class="input-group">
              <label for="last_name">Last Name</label>
              <input
                type="text"
                id="last_name"
                name="last_name"
                placeholder="e.g. Doe"
              />
            </div>

            <div class="input-group full-width">
              <label for="specialization">Specialization</label>
              <input
                type="text"
                id="specialization"
                name="specialization"
                placeholder="e.g. Computer Science"
              />
            </div>

            <div class="input-group">
              <label for="study_year">Year of Study</label>
              <input
                type="number"
                id="study_year"
                name="study_year"
                min="1"
                max="6"
                placeholder="1-6"
              />
            </div>

            <div class="input-group">
              <label for="username_display">Username (Cannot be changed)</label>
              <input
                type="text"
                id="username_display"
                disabled
                class="disabled-input"
              />
            </div>
          </div>

          <button type="submit" class="save-btn">Save Changes</button>
        </form>
      </div>
    </main>

    <!-- Change Password Modal -->
    <div id="passwordModal" class="modal-overlay">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Change Password</h2>
          <button id="closePasswordModalBtn" class="btn-icon">
            <span class="material-symbols-rounded">close</span>
          </button>
        </div>
        <form id="passwordForm">
          <div class="input-group">
            <label for="currentPassword">Current Password</label>
            <input type="password" id="currentPassword" required />
          </div>
          <div class="input-group">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" required />
          </div>
          <div class="input-group">
            <label for="confirmPassword">Confirm New Password</label>
            <input type="password" id="confirmPassword" required />
          </div>
          <div class="modal-actions">
            <button type="button" class="btn-cancel" id="cancelPasswordBtn">
              Cancel
            </button>
            <button
              type="submit"
              class="save-btn"
              style="width: auto; min-width: 150px"
            >
              Update Password
            </button>
          </div>
        </form>
      </div>
    </div>

    <script src="/Settings/settings.js"></script>
  </body>
</html>
